name: 改进建议
description: 说明使用场景与希望改善的行为
body:
  - type: textarea
    id: problem
    attributes:
      label: 希望解决的问题
      description: 描述使用场景和当前障碍，不包含个人账户信息。
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议的行为
      description: 说明预期结果、适用范围和可以接受的限制。
    validations:
      required: true
